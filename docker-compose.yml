services:
  backend:
    build: ./backend
    container_name: ca-backend
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 15s
      timeout: 5s
      retries: 3

  frontend:
    build: ./frontend
    container_name: ca-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    restart: unless-stopped
