services:
  backend:
    build: ./backend
    container_name: ca-backend
    ports:
      - "8000:8000"
    environment:
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-5.4-mini}
      OPENAI_TIMEOUT_SECONDS: ${OPENAI_TIMEOUT_SECONDS:-12}
      EPIDEMIC_PRESENT_DATE: ${EPIDEMIC_PRESENT_DATE:-}
    volumes:
      - ./backend:/app
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 15s
      timeout: 5s
      retries: 3

  frontend:
    build: ./frontend
    container_name: ca-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    restart: unless-stopped
